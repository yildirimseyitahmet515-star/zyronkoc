<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zyron Koçluk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F2EE;--surface:#FFFFFF;--ink:#172A4A;--muted:#5F6B7D;--line:#E4DFD3;
  --accent:#14707D;--accent-ink:#FFFFFF;--signal:#F5A524;--signal-ink:#172A4A;--danger:#B3261E;
  --navy:#172A4A;--navy-ink:#FFFFFF;--disabled:#EFE8DA;--disabled-ink:#B7AE98;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626;--surface:#17233A;--ink:#EAF0FA;--muted:#9AA7BD;--line:#2A3956;
    --accent:#3FB7C4;--accent-ink:#06222A;--danger:#FF8A80;
    --navy:#EAF0FA;--navy-ink:#0E1626;--disabled:#22304A;--disabled-ink:#6B7A93;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626;--surface:#17233A;--ink:#EAF0FA;--muted:#9AA7BD;--line:#2A3956;
  --accent:#3FB7C4;--accent-ink:#06222A;--danger:#FF8A80;
  --navy:#EAF0FA;--navy-ink:#0E1626;--disabled:#22304A;--disabled-ink:#6B7A93;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 18px 120px}
main.noNav{padding:16px 14px 40px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-0.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.sm{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}

/* Onboarding */
.ob{background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.ob-head{display:flex;align-items:center;gap:16px;padding:22px 24px;color:#fff;background:linear-gradient(110deg,#172A4A 0%,#2A6A9A 62%,#178796 100%)}
.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#F7A21B,#F26B3A);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.ob-head .t{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.1}
.ob-head .s{font-size:16px;opacity:.9;margin-top:2px}
.ob-body{padding:22px 22px 26px}
.ob-intro{font-size:17px;line-height:1.6;color:var(--muted)}
.f-label{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted);margin:24px 0 10px;font-size:16px}
.f-label svg{width:20px;height:20px;flex:none}
.seg{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 6px;font-weight:600;color:var(--muted);line-height:1.2;min-height:50px}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ob input[type=text],.ob input[type=number],.ob input[type=date],.ob input[type=time],.ob select{background:var(--surface);border-radius:14px;min-height:54px;font-size:17px}
.ob input[type=date]{background:var(--bg)}
select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}
input[type=range]{width:100%;accent-color:var(--navy);height:32px}
.hint{min-height:20px;margin-top:14px;font-size:14px;color:var(--danger)}
.cta{width:100%;margin-top:10px;padding:16px;border-radius:14px;border:0;font-weight:700;font-size:17px;background:var(--navy);color:var(--navy-ink);min-height:54px}
.cta:disabled{background:var(--disabled);color:var(--disabled-ink);cursor:not-allowed}
.sub-actions{display:flex;justify-content:center;margin-top:10px}
.suggest{list-style:none;margin:6px 0 0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;max-height:260px;overflow:auto}
.suggest[hidden]{display:none}
.suggest button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:11px 10px;font-size:16px}
.suggest button:hover,.suggest button:focus-visible{background:var(--bg)}
.school-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.school-row:first-child{border-top:0}
.school-row .no{width:26px;height:26px;border-radius:8px;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.school-row .nm{flex:1;line-height:1.3}

/* Today */
.hero{display:flex;gap:16px;align-items:center;margin-top:18px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:800}
.question{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;letter-spacing:-0.015em;margin-top:6px}
.mark{background:linear-gradient(transparent 62%,var(--signal) 62%,var(--signal) 92%,transparent 92%);padding:0 2px}
.count{display:flex;align-items:center;gap:16px}
.big{font-family:var(--display);font-size:46px;font-weight:800;line-height:1}

/* Controls */
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:600;min-height:46px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px}
.link{background:none;border:0;color:var(--muted);padding:6px 4px;font-size:14px;text-decoration:underline}
.link.danger{color:var(--danger)}
input[type=text],input[type=number],input[type=date],input[type=time],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--signal);outline-offset:1px}
.energy{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.energy button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 0;font-weight:600}
.energy button[aria-pressed=true]{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.energy-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}

/* Habits + checks */
.habit{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:0}
.check{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);background:transparent;flex:none;display:grid;place-items:center;padding:0}
.check[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:18px;height:18px;opacity:0}
.check[aria-pressed=true] svg{opacity:1}
.habit .name{flex:1;font-weight:500}
.habit .name.done{color:var(--muted);text-decoration:line-through}
.streak{font-size:13px;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px}
.addline{display:flex;gap:8px;margin-top:10px}

/* Program */
.block{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.block:first-of-type{border-top:0}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;width:48px;flex:none}
.block .name{flex:1;font-weight:500}
.block .name.done{color:var(--muted);text-decoration:line-through}
.block .dur{font-size:13px;color:var(--muted);white-space:nowrap}
.phase{padding:12px 0;border-top:1px solid var(--line)}
.phase:first-of-type{border-top:0}
.phase.now{background:var(--bg);border-radius:12px;padding:12px;margin:4px 0;border-top:0}
.pill{display:inline-block;font-size:12px;font-weight:700;background:var(--signal);color:var(--signal-ink);border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:2px}
.wrow{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.wrow:first-of-type{border-top:0}
.wrow b{width:34px;flex:none}
.wrow.now b{color:var(--accent)}
.wrow.now{font-weight:600}
.bar{position:relative;height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.bar>u{position:absolute;top:0;bottom:0;width:3px;background:var(--signal)}
.sect{padding:10px 0;border-top:1px solid var(--line)}
.sect:first-of-type{border-top:0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{flex:1;background:var(--bg);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:800;line-height:1.2}

/* Chart */
.chartwrap{position:relative;height:170px;margin-top:16px}
.plot{position:absolute;left:0;right:0;top:18px;bottom:22px;display:flex;align-items:flex-end;gap:8px}
.pb{flex:1;background:var(--accent);border-radius:8px 8px 3px 3px;position:relative;min-height:3px}
.pb span{position:absolute;left:0;right:0;top:-18px;text-align:center;font-size:12px;font-weight:600}
.tline{position:absolute;left:0;right:0;border-top:2px dashed var(--signal);pointer-events:none}
.lbls{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;font-size:11px;color:var(--muted)}
.lbls span{flex:1;text-align:center}

/* Week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-top:14px}
.week .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.week .col .b{width:100%;background:var(--accent);border-radius:8px 8px 3px 3px;min-height:4px}
.week .col .b.empty{background:var(--line)}
.week .col small{font-size:12px;color:var(--muted)}
.week .col.today small{color:var(--ink);font-weight:600}

/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav .inner{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:560px}
nav button{background:none;border:0;border-radius:12px;padding:8px 2px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button[aria-current=page]{color:var(--ink);background:var(--bg)}
nav button[aria-current=page] svg{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.empty-note{padding:6px 0 2px;color:var(--muted)}
.chat{height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.msg{max-width:88%;background:var(--bg);border-radius:14px;padding:8px 12px;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--navy);color:var(--navy-ink)}
.msg .mh{display:flex;gap:8px;align-items:baseline;font-size:12px}
.msg .mh span{opacity:.7}
.msg .mt{margin-top:2px;word-break:break-word;white-space:pre-wrap}
.msg .x{background:none;border:0;color:inherit;opacity:.65;font-size:12px;text-decoration:underline;padding:0}
.chatbar{display:flex;gap:8px;margin-top:12px}
main.chatfull{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;max-width:none;margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;background:var(--bg);z-index:20}
.cf-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.cf-head b{flex:1;font-family:var(--display);font-size:18px}
.cf-back{background:none;border:0;font-weight:600;padding:8px 6px;color:var(--ink)}
.cf-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px 0}
.cf-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:600;color:var(--muted)}
.cf-tabs button[aria-pressed=true]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.cf-body{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cf-compose{display:flex;gap:8px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line)}
.cf-note{font-size:13px;color:var(--muted);padding:8px 14px 0}
.role{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--line);color:var(--ink)}
.role.f{background:var(--signal);color:var(--signal-ink)}
.role.a{background:var(--accent);color:var(--accent-ink)}
.conv{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.cv-top{display:flex;align-items:center;gap:8px}
.cv-txt{overflow:hidden;text-overflow:ellipsis}
.btn:disabled{opacity:.45;cursor:not-allowed}
.swtime{font-family:var(--display);font-size:60px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;line-height:1.1;padding:8px 0}
.at{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding-left:16px}
.at span{font-size:20px;font-weight:700;color:var(--muted)}
.at input{border:0!important;background:transparent!important;min-height:54px;font-size:18px}
.mini{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;background:var(--navy);color:var(--navy-ink);border-radius:16px;padding:8px 10px 8px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.mini-go{background:none;border:0;display:flex;align-items:center;gap:8px;color:inherit;padding:4px 0;min-width:0;text-align:left}
.mini-go b{font-variant-numeric:tabular-nums;font-size:18px}
.mini-go .lab{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--signal);flex:none}
.mini .btn{background:var(--navy-ink);color:var(--navy)}
.pe{padding:12px 0;border-top:1px solid var(--line)}
.pe:first-child{border-top:0}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Ana menü" id="navwrap"><div class="inner" id="nav"></div></nav>
<div class="mini" id="mini"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var SESSION_KEY='zyron.session';

  var CITIES=['Adana','Adıyaman','Afyonkarahisar','Ağrı','Aksaray','Amasya','Ankara','Antalya','Ardahan','Artvin','Aydın','Balıkesir','Bartın','Batman','Bayburt','Bilecik','Bingöl','Bitlis','Bolu','Burdur','Bursa','Çanakkale','Çankırı','Çorum','Denizli','Diyarbakır','Düzce','Edirne','Elazığ','Erzincan','Erzurum','Eskişehir','Gaziantep','Giresun','Gümüşhane','Hakkâri','Hatay','Iğdır','Isparta','İstanbul','İzmir','Kahramanmaraş','Karabük','Karaman','Kars','Kastamonu','Kayseri','Kırıkkale','Kırklareli','Kırşehir','Kilis','Kocaeli','Konya','Kütahya','Malatya','Manisa','Mardin','Mersin','Muğla','Muş','Nevşehir','Niğde','Ordu','Osmaniye','Rize','Sakarya','Samsun','Siirt','Sinop','Sivas','Şanlıurfa','Şırnak','Tekirdağ','Tokat','Trabzon','Tunceli','Uşak','Van','Yalova','Yozgat','Zonguldak'];

  var UNIS=[

  function cryptoOk(){return !!(window.crypto&&window.crypto.subtle&&window.TextEncoder);}
  function hex(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=('0'+u[i].toString(16)).slice(-2);return s;}
  function unhex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
  function eqHex(a,b){if(a.length!==b.length)return false;var d=0;for(var i=0;i<a.length;i++)d|=a.charCodeAt(i)^b.charCodeAt(i);return d===0;}
  async function hashPw(pw,saltHex){
    var salt=saltHex?unhex(saltHex):window.crypto.getRandomValues(new Uint8Array(16));
    var k=await window.crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    var bits=await window.crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:120000,hash:'SHA-256'},k,256);
    return {salt:hex(salt),hash:hex(bits)};
  }

  async function registerOnline(h,pw){
    if(!dbx||!uidv)return 'local';
    try{
      var hp=await hashPw(pw);
      var ref=dbx.doc('handles/'+h);
      for(var i=0;i<4;i++){
        var r=await ref.acquire({holder:uidv,ttlMs:6000});
        if(!r.acquired){await sleep(1000);continue;}
        var s=await ref.get(),d=s.exists?s.data():null;
        if(d&&(d.hash||(d.owner&&d.owner!==uidv)))return 'taken';
        await ref.set({owner:uidv,salt:hp.salt,hash:hp.hash,at:Date.now()});
        return 'ok';
      }
      return 'busy';
    }catch(e){
      if(e&&e.code==='resource_exhausted')return 'busy';
      return 'error';
    }
  }

          toast('Çevrimiçi kayıt yapılamadı, hesap bu cihazda açıldı.');
        }
      }else{
        var r2=await loginOnline(h,pw);
        if(r2==='ok'){idle();setAccount(h,true);return;}
        if(r2==='wrong'){idle();setLgErr('Şifre yanlış.',false);return;}
        if(r2==='nohash'){idle();setLgErr('Bu hesabın şifresi yok. Kayıt ol sekmesinden aynı kullanıcı adıyla şifre belirle.',false);return;}
        var la=localAcc(h);
        if(la){
          var lh=await hashPw(pw,la.salt);idle();
          if(eqHex(lh.hash,la.hash))setAccount(h,false);else setLgErr('Şifre yanlış.',false);
          return;
        }
        idle();
        if(r2==='nouser')setLgErr('@'+h+' diye bir kullanıcı yok. Kayıt ol sekmesinden hesap oluştur.',false);
        else setLgErr('Çevrimiçi hesaplara bağlanılamadı ve bu cihazda @'+h+' kayıtlı değil.',false);
      }
    }catch(e){idle();setLgErr('Bir hata oluştu. Tekrar dene.',false);}
  }

  function isFounder(){return !!account&&account.handle===FOUNDER&&account.verified===true;}
  async function verifyOwner(){
    try{
      var u=(window.claude&&window.claude.use)?await window.claude.use('user'):null;
      if(!u){
        ownerVerified=false;
        ownerReason='Bu görünümde kimlik doğrulama kullanılamıyor. Uygulamayı claude.ai içinden, sayfayı yayınlayan hesabınla giriş yapmışken aç.';
        return false;
      }
      var own=await u.isOwner();
      ownerVerified=!!own;
      ownerReason=own?'':'Bu hesap sayfanın sahibi olarak görünmüyor. Uygulamayı sayfayı yayınlayan Claude hesabınla giriş yapmışken aç.';
      if(own)ensureProfilesSub();
      return !!own;
    }catch(e){
      ownerVerified=false;ownerReason='Doğrulama sırasında hata oluştu. Tekrar dene.';return false;
    }

  function isAdmin(){return !!account&&account.verified&&account.handle!==FOUNDER&&allAdmins.indexOf(account.handle)>=0;}

  function chatTime(at){
    var d=new Date(at),t=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    return key(d)===todayKey()?t:d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})+' '+t;
  }
  function roleOf(h){return h===FOUNDER?'f':(allAdmins.indexOf(h)>=0?'a':'u');}

        chatMsgs=s.docs.map(function(d){var v=d.data()||{};return {id:d.id,handle:String(v.handle||''),text:String(v.text||''),at:+v.at||0};}).sort(function(a,b){return a.at-b.at;});

    if(canSend){
      h+='<div class="chatbar"><input type="text" id="chatInput" maxlength="300" placeholder="Mesaj yaz" value="'+esc(chatText)+'" autocomplete="off"><button class="btn" data-act="chat-send">Gönder</button></div>';
    }else{
      h+='<p class="muted sm" style="margin-top:12px">Mesaj yazmak için çevrimiçi hesapla giriş yapman gerekiyor. Yerel hesaplar mesajları okuyabilir ama yazamaz.</p>';

  async function sendChat(){
    var inp=document.getElementById('chatInput'),t=((inp?inp.value:chatText)||'').trim();
    if(!t)return;
    if(!dbx||!account||!account.verified){toast('Mesaj için çevrimiçi hesapla giriş yap');return;}
    if(Date.now()-chatLastSend<2000){toast('Biraz yavaş yaz');return;}
    chatLastSend=Date.now();
    try{
      await dbx.collection('chat').add({handle:account.handle,text:t.slice(0,300),at:Date.now()});
      chatText='';if(inp)inp.value='';

      pruneChat();
    }catch(e){toast('Mesaj gönderilemedi (yazma izni olmayabilir)');}
  }
  async function pruneChat(){
    if(!dbx||Math.random()>0.2)return;
    try{
      var s=await dbx.collection('chat').where('at','<',Date.now()-7*86400000).limit(10).get();
      for(var i=0;i<s.docs.length;i++)await dbx.doc('chat/'+s.docs[i].id).delete();
    }catch(e){}
  }

  /* ---------- Private messages + full-screen chat ---------- */
  function markRead(p){state.dmRead=state.dmRead||{};state.dmRead[p]=Date.now();saveSoon();}
  function ensureDmSub(){
    if(dmSubs.length||!dbx||!account||!account.verified)return;
    var me=account.handle;
    function sub(field,store){
      try{
        return dbx.collection('dms').where(field,'==',me).limit(300).onSnapshot(function(s){
          var m={};
          s.docs.forEach(function(d){var v=d.data()||{};m[d.id]={id:d.id,from:String(v.from||''),to:String(v.to||''),text:String(v.text||''),at:+v.at||0};});
          if(store==='in')dmIn=m;else dmOut=m;
          paintDm();
        },function(){});
      }catch(e){return function(){};}
    }
    dmSubs=[sub('to','in'),sub('from','out')];
  }
  function dmAllMsgs(){var a=[],k;for(k in dmIn)a.push(dmIn[k]);for(k in dmOut)if(!dmIn[k])a.push(dmOut[k]);return a;}
  function dmThread(peer){
    var me=account.handle;
    return dmAllMsgs().filter(function(m){return (m.from===peer&&m.to===me)||(m.to===peer&&m.from===me);}).sort(function(a,b){return a.at-b.at;});
  }
  function dmConvos(){
    var by={},me=account.handle,rd=state.dmRead||{};
    dmAllMsgs().forEach(function(m){
      var peer=m.from===me?m.to:m.from;
      var c=by[peer]||(by[peer]={peer:peer,last:m,unread:0});
      if(m.at>c.last.at)c.last=m;
      if(m.to===me&&m.at>(rd[peer]||0))c.unread++;
    });
    return Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.last.at-a.last.at;});
  }
  function dmThreadHtml(peer){
    var list=dmThread(peer);
    if(!list.length)return '<p class="empty-note" style="padding:12px">Henüz mesaj yok. İlk mesajı sen yaz.</p>';
    return list.map(function(m){
      var mine=m.from===account.handle;
      var del=(mine||isFounder())?'<button class="x" data-act="dm-del" data-id="'+esc(m.id)+'">Sil</button>':'';
      return '<div class="msg'+(mine?' me':'')+'"><div class="mh"><b'+(mine?'':' style="color:'+chatColor(m.from)+'"')+'>@'+esc(m.from)+'</b><span>'+esc(chatTime(m.at))+'</span>'+roleBadge(m.from)+del+'</div><div class="mt">'+esc(m.text)+'</div></div>';
    }).join('');
  }
  function dmListHtml(){
    var cs=dmConvos();
    if(!cs.length)return '<p class="empty-note">Henüz özel mesajın yok. Yukarıdan bir kullanıcı ara veya genel odada birinin yanındaki "Özel mesaj" düğmesine dokun.</p>';
    return cs.map(function(c){
      var t=c.last.text;if(t.length>60)t=t.slice(0,60)+'...';
      return '<button class="conv" data-act="dm-open" data-id="'+esc(c.peer)+'"><span class="cv-top"><b>@'+esc(c.peer)+'</b>'+roleBadge(c.peer)+'<span class="muted sm" style="margin-left:auto">'+esc(chatTime(c.last.at))+'</span></span>'+
        '<span class="cv-txt muted sm">'+(c.last.from===account.handle?'Sen: ':'')+esc(t)+'</span>'+(c.unread?'<span class="pill" style="margin:0;align-self:flex-start">'+c.unread+' yeni</span>':'')+'</button>';
    }).join('');
  }
  function paintDm(){
    if(!chatOpen||chatTab!=='dm'||!account)return;
    if(dmPeer){
      var el=document.getElementById('dmThread');if(!el)return;

  /* ---------- Profile helpers ---------- */
  function targetText(p){
    if(p.exam==='lgs'){
      var s=p.schools||[];
      if(!s.length)return '-';
      return s[0].name+' ('+s[0].city+')'+(s.length>1?' +'+(s.length-1)+' okul':'');

  function daysLeft(p){return diffDays(new Date(),pd(p.date));}

  /* ---------- Programs (one per statistic) ---------- */
  function latestNet(id){
    var list=state.denemeler.filter(function(d){return d.prog===id;});
    if(!list.length)return null;
    list.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
    return list[0].net;
  }
  function programsOf(p){
    var out=[];
    if(p.exam==='lgs'){
      out.push({id:'lgs',label:'LGS',max:90,start:p.cur1,tar:p.tar1,sections:SECT.lgs});
    }else{
      out.push({id:'tyt',label:'TYT',max:120,start:p.cur1,tar:p.tar1,sections:SECT.tyt});
      if(p.exam==='yks')out.push({id:'ayt',label:'AYT',max:80,start:p.cur2,tar:p.tar2,sections:SECT.ayt[p.alan]||SECT.ayt.sayisal});
    }
    out.forEach(function(g){var l=latestNet(g.id);g.cur=l==null?g.start:l;g.hasLog=l!=null;});
    return out;
  }
  function getSel(progs){
    var ok=progs.filter(function(g){return g.id===progSel;})[0];
    if(!ok){progSel=progs[0].id;ok=progs[0];}
    return ok;
  }
  function splitNet(sections,total,maxTotal){
    return sections.map(function(s){return {n:s[0],max:s[1],v:Math.round(total*s[1]/maxTotal*2)/2};});
  }
  function progressPct(g){
    if(g.cur>=g.tar)return 100;
    if(g.tar<=g.start)return 0;
    return Math.max(0,Math.min(100,Math.round((g.cur-g.start)/(g.tar-g.start)*100)));
  }

  /* ---------- Plan engine ---------- */
  function buildPhases(p){
    var start=pd(p.createdAt||todayKey());
    var total=diffDays(start,pd(p.date));
    if(total<=0)return [];
    var defs;
    if(p.exam==='lgs'){
      defs=[{r:.7,name:'LGS konu tarama ve soru çözümü',kind:'study',progId:'lgs',subjects:SUBJ.lgs,exam:'LGS denemesi'},
            {r:.3,name:'Deneme ve tekrar',kind:'exam',progId:'all',exam:'LGS denemesi'}];
    }else if(p.exam==='tyt'){
      defs=[{r:.7,name:'TYT konu tarama ve soru çözümü',kind:'study',progId:'tyt',subjects:SUBJ.tyt,exam:'TYT denemesi'},
            {r:.3,name:'Deneme ve tekrar',kind:'exam',progId:'all',exam:'TYT denemesi'}];
    }else{
      var gT=Math.max(0,p.tar1-p.cur1)/120,gA=Math.max(0,p.tar2-p.cur2)/80;
      var share=(gT+gA)>0?gT/(gT+gA):.5;
      share=Math.min(.7,Math.max(.3,share));
      var rT=.85*share,rA=.85-rT;
      defs=[{r:rT,name:'TYT konu tarama ve soru çözümü',kind:'study',progId:'tyt',subjects:SUBJ.tyt,exam:'TYT denemesi'},
            {r:rA,name:'AYT konu tarama ve soru çözümü',kind:'study',progId:'ayt',subjects:SUBJ.ayt[p.alan]||SUBJ.ayt.sayisal,exam:'AYT denemesi'},
            {r:.15,name:'Deneme ve tekrar',kind:'exam',progId:'all',exam:'YKS denemesi'}];
    }
    var phases=[],acc=0,prev=0;
    defs.forEach(function(d,i){
      acc+=d.r;
      var end=(i===defs.length-1)?total:Math.round(total*acc);
      if(end>prev){
        phases.push({name:d.name,kind:d.kind,progId:d.progId,subjects:d.subjects,exam:d.exam,from:addDays(start,prev),to:addDays(start,end-1),offset:prev,len:end-prev});
      }
      prev=end;
    });
    return phases;
  }
  function phaseFor(p,date){
    var phases=buildPhases(p);if(!phases.length)return null;
    var start=pd(p.createdAt||todayKey());
    var off=diffDays(start,date);
    if(off<0)off=0;
    for(var i=0;i<phases.length;i++){if(off>=phases[i].offset&&off<phases[i].offset+phases[i].len)return {ph:phases[i],off:off};}
    return null;
  }
  function mins(M,f){return Math.max(5,Math.round(M*f/5)*5);}
  function fitBlocks(M,list){
    var out=[],sum=0;
    list.forEach(function(b,i){
      var m=(i===list.length-1)?Math.max(5,M-sum):mins(M,b.f);
      sum+=m;out.push({t:b.t,min:m});
    });
    return out;
  }
  function pair(S,weekIdx,w){var n=S.length,c=weekIdx*12+w*2;return [S[c%n],S[(c+1)%n]];}
  function studyLabel(p,S,weekIdx,w){
    var pr=pair(S,weekIdx,w),a=pr[0],b=pr[1];
    if(S.length===1||a===b||p.hours<4)return a;
    return a+' · '+b;
  }
  function dayPlanBase(p,date){
    if(!p)return null;
    var r=phaseFor(p,date);if(!r)return null;
    var ph=r.ph,dow=date.getDay(),M=Math.round(p.hours*60),weekIdx=Math.floor(r.off/7);
    var label,list;
    if(dow===0){
      label='Deneme günü';
      list=[{t:'Haftalık deneme sınavı',f:.45},{t:'Yanlış analizi',f:.30},{t:'Haftalık tekrar ve gelecek hafta planı',f:.25}];
    }else{
      var w=dow-1;
      if(ph.kind==='exam'){
        var en=ph.exam;
        if(p.exam==='yks')en=(weekIdx%2===0)?'TYT denemesi':'AYT denemesi';
        if(w%2===0){
          label='Deneme ve analiz';
          list=[{t:en+' (zamanlı)',f:.45},{t:'Deneme analizi ve yanlış defteri',f:.30},{t:'Zayıf konu tekrarı',f:.25}];
        }else{
          label='Zayıf konu tekrarı';
          list=[{t:'Zayıf konulardan soru çözümü',f:.45},{t:'Konu tekrarı ve özet çıkarma',f:.30},{t:'Yanlış defteri ve formül / kelime tekrarı',f:.25}];
        }
      }else{
        var S=ph.subjects,pr=pair(S,weekIdx,w),a=pr[0],b=pr[1];
        label=studyLabel(p,S,weekIdx,w);
        if(S.length===1||a===b||p.hours<4){
          list=[{t:a+' konu çalışması',f:.40},{t:a+' soru çözümü',f:.35},{t:'Genel tekrar ve yanlış defteri',f:.25}];
        }else{
          list=[{t:a+' konu çalışması',f:.26},{t:a+' soru çözümü',f:.16},{t:b+' konu çalışması',f:.24},{t:b+' soru çözümü',f:.14},{t:'Genel tekrar ve yanlış defteri',f:.20}];
        }
      }
    }
    var blocks=fitBlocks(M,list);
    var st=(p.start||'09:00').split(':'),t=(+st[0])*60+(+st[1]);
    blocks.forEach(function(b){
      b.time=z(Math.floor(t/60)%24)+':'+z(t%60);
      t+=b.min+10;
    });
    return {label:label,phase:ph.name,blocks:blocks};
  }
  function fmtDur(m){var h=Math.floor(m/60),r=m%60;return h?(r?h+' sa '+r+' dk':h+' sa'):r+' dk';}

  /* ---------- Onboarding ---------- */
  function chk(v,max){
    if(v===''||v==null)return 'empty';
    var n=num(v);
    if(isNaN(n)||n<0||n>max)return 'range';
    return 'ok';
  }
  function validate(d){
    var ex=EXAMS[d.exam];
    if(!d.name.trim())return {ok:false,msg:''};
    if(d.exam==='lgs'){if(!d.schools.length)return {ok:false,msg:''};}
    else if(!d.uni.trim()||!d.dept.trim())return {ok:false,msg:''};
    var sts=[chk(d.cur1,ex.max1),chk(d.tar1,ex.max1)];
    if(d.exam==='yks'){sts.push(chk(d.cur2,ex.max2));sts.push(chk(d.tar2,ex.max2));}
    if(sts.indexOf('range')>=0){
      return {ok:false,msg:'Net sayısı 0 ile '+ex.max1+(d.exam==='yks'?' (TYT) ve 0 ile '+ex.max2+' (AYT)':'')+' arasında olmalı.'};
    }
    if(sts.indexOf('empty')>=0)return {ok:false,msg:''};
    if(!d.date)return {ok:false,msg:''};
    if(diffDays(new Date(),pd(d.date))<=0)return {ok:false,msg:'Sınav tarihi bugünden sonra olmalı.'};
    return {ok:true,msg:''};
  }

  function viewWeek(){
    var html='<h1>Bu hafta</h1><p class="muted">Son 7 günün özeti.</p>';
    var cols='',energySum=0,energyN=0,logged=0,scoreSum=0,scoreN=0,planDone=0,planAll=0;
    for(var i=6;i>=0;i--){
      var d=daysAgo(i),k=key(d),s=dayScore(k),l=state.logs[k];
      if(l&&l.energy){energySum+=l.energy;energyN++;}
      if(l&&(l.answer||l.energy))logged++;
      if(s!==null){scoreSum+=s;scoreN++;}
      var pdn=state.planDone[k];
      if(pdn&&state.profile){var dpl=dayPlan(state.profile,d);if(dpl){planAll+=dpl.blocks.length;pdn.forEach(function(x){if(x)planDone++;});}}
      var h=s===null?0:Math.round(s*100);
      cols+='<div class="col'+(i===0?' today':'')+'"><div class="b'+(h===0?' empty':'')+'" style="height:'+Math.max(h,4)+'%"></div><small>'+DAYS[d.getDay()]+'</small></div>';
    }
    html+='<section class="card"><h3>Alışkanlık tamamlama</h3><div class="week" role="img" aria-label="Son 7 gün alışkanlık tamamlama grafiği">'+cols+'</div></section>';
    html+='<div class="row" style="margin-top:14px;align-items:stretch">'+
      '<div class="stat"><b>'+(scoreN?'%'+Math.round(scoreSum/scoreN*100):'-')+'</b><span class="muted sm">alışkanlık</span></div>'+
      '<div class="stat"><b>'+(energyN?(energySum/energyN).toFixed(1):'-')+'</b><span class="muted sm">enerji (1-5)</span></div>'+
      '<div class="stat"><b>'+logged+'/7</b><span class="muted sm">kayıtlı gün</span></div></div>';
    var secWeek=0;
    for(var q=0;q<7;q++){var kk=key(daysAgo(q));state.sessions.forEach(function(x){if(x.date===kk)secWeek+=x.sec;});}
    html+='<div class="card"><h3>Kronometre ile çalışma</h3><p style="margin-top:6px"><b>'+fmtDur(Math.round(secWeek/60))+'</b> <span class="muted sm">son 7 günde</span></p></div>';
    if(state.profile){html+='<div class="card"><h3>Çalışma blokları</h3><p style="margin-top:6px"><b>'+planDone+'</b> blok tamamlandı <span class="muted sm">(işaretlenen günlerde '+planAll+' bloktan)</span></p></div>';}
    var wk=weekKey(),w=state.weekly[wk]||{};
    html+='<section class="card"><h2>Haftalık değerlendirme</h2><div class="stack" style="margin-top:12px">';
    WEEKLY.forEach(function(q,i){
      html+='<div><label for="w'+i+'" style="font-weight:600">'+esc(q)+'</label><textarea id="w'+i+'" data-w="'+i+'" style="margin-top:8px;min-height:80px">'+esc((w.a&&w.a[i])||'')+'</textarea></div>';
    });
    return html+'</div></section>';
  }

  document.addEventListener('click',function(e){
    if(!e.target.closest('#obUniWrap'))hideSuggest();
    var b=e.target.closest('[data-act]');if(!b)return;
    var act=b.dataset.act,id=b.dataset.id;

    if(act==='login'){doLogin(false);return;}
    if(act==='login-local'){doLogin(true);return;}
    if(act==='logout'){logout();return;}
    if(act==='founder-verify'){verifyOwner().then(function(ok){toast(ok?'Sahiplik doğrulandı':'Doğrulanamadı');render(true);if(ok)scheduleSync();});return;}
    if(act==='chat-close'){chatOpen=false;dmPeer=null;render();return;}
    if(act==='chat-tab'){chatTab=b.dataset.v;dmPeer=null;render();return;}
    if(act==='dm-open'){
      if(!account||!account.verified){toast('Özel mesaj için çevrimiçi hesapla giriş yap');return;}
      if(id===account.handle)return;
      chatOpen=true;chatTab='dm';dmPeer=id;markRead(id);render();return;
    }
    if(act==='dm-back'){dmPeer=null;render();return;}
    if(act==='dm-send'){sendDm();return;}
    if(act==='dm-del'){
      var dmm=dmAllMsgs().filter(function(x){return x.id===id;})[0];
      if(!dmm||!dbx||!account||(dmm.from!==account.handle&&!isFounder()))return;
      dbx.doc('dms/'+id).delete().catch(function(){toast('Mesaj silinemedi');});return;
    }
    if(act==='dm-adel'){
      if(!isFounder()||!dbx)return;
      dbx.doc('dms/'+id).delete().catch(function(){toast('Mesaj silinemedi');});return;
    }
    if(act==='chat-send'){sendChat();return;}
    if(act==='chat-del'){
      var cm=chatMsgs.filter(function(x){return x.id===id;})[0];
      if(!cm||!dbx||!account||(cm.handle!==account.handle&&!canManage()))return;
      dbx.doc('chat/'+id).delete().catch(function(){toast('Mesaj silinemedi');});return;
    }
    if(act==='adm-add'){
      if(!isFounder()||!dbx)return;
      dbx.doc('admins/'+id).set({by:FOUNDER,at:Date.now()}).then(function(){toast('@'+id+' admin yapıldı');}).catch(function(){toast('Admin eklenemedi (sayfa sahibi izni gerekir)');});
      return;
    }
    if(act==='adm-rem'){
      if(!isFounder()||!dbx)return;
      dbx.doc('admins/'+id).delete().then(function(){toast('@'+id+' artık admin değil');}).catch(function(){toast('Adminlik kaldırılamadı (sayfa sahibi izni gerekir)');});
      return;
    }
    if(act==='del-user'){
      if(!canDelete(id))return;
      if(pendingDelete==='u'+id){pendingDelete=null;deleteUser(id);}else{pendingDelete='u'+id;}
      paintAdmin();return;
    }
    if(act==='lg-mode'){loginMode=b.dataset.v;render(true);return;}
    if(act==='lg-eye'){
      var pw1=document.getElementById('lgPw'),pw2=document.getElementById('lgPw2'),show=pw1&&pw1.type==='password';
      if(pw1)pw1.type=show?'text':'password';if(pw2)pw2.type=show?'text':'password';
      b.textContent=show?'Gizle':'Göster';return;
    }
    if(act==='more'){if(b.dataset.v==='chat'){chatOpen=true;chatTab='room';dmPeer=null;render();return;}moreSel=b.dataset.v;render(true);return;}
    if(act==='sw-toggle'){if(state.sw.running)swPause();else swStart();return;}
    if(act==='sw-lap'){swLap();return;}
    if(act==='sw-save'){swSave();return;}
    if(act==='sw-reset'){swReset();return;}
    if(act==='sw-label'){state.sw.label=b.dataset.t;save();render(true);return;}
    if(act==='sw-notif'){enableNotif();return;}
    if(act==='del-session'){
      if(pendingDelete==='s'+id){state.sessions=state.sessions.filter(function(x){return x.id!==id;});pendingDelete=null;save();toast('Silindi');}
      else pendingDelete='s'+id;
      render(true);return;
    }
    if(act==='plan-edit'){
      var pl=dayPlan(state.profile,new Date());if(!pl)return;
      planDraft=pl.blocks.map(function(x){return {t:x.t,min:x.min};});planEdit=true;render(true);return;
    }
    if(act==='plan-add'){planDraft.push({t:'Yeni blok',min:30});render(true);return;}
    if(act==='plan-del'){planDraft.splice(+b.dataset.i,1);render(true);return;}
    if(act==='plan-cancel'){planEdit=false;render(true);return;}
    if(act==='plan-reset'){
      delete state.planEdits[todayKey()];delete state.planDone[todayKey()];planEdit=false;save();toast('Varsayılan plana dönüldü');render(true);return;
    }
    if(act==='plan-save'){
      var cl=planDraft.filter(function(x){return String(x.t).trim();}).map(function(x){return {t:String(x.t).trim(),min:Math.max(5,Math.min(480,Math.round(+x.min||5)))};});
      if(!cl.length){toast('En az bir blok olmalı');return;}
      state.planEdits[todayKey()]=cl;state.planDone[todayKey()]=[];planEdit=false;save();toast('Plan kaydedildi');render(true);return;
    }
    if(act==='save-settings'){
      var hh=+val('setHours'),stt=val('setStart')||'09:00';
      if(!state.profile||!hh)return;
      state.profile.hours=hh;state.profile.start=stt;save();toast('Ayarlar kaydedildi');render(true);return;
    }

    if(act==='exam'){
      var v=b.dataset.v;
      if(v==='lgs'&&draft.date==='2027-06-19')draft.date='';
      if(v!=='lgs'&&draft.date==='')draft.date='2027-06-19';
      draft.exam=v;render(true);return;
    }
    if(act==='alan'){draft.alan=b.dataset.v;render(true);return;}
    if(act==='pick-uni'){
      draft.uni=UNIS[+b.dataset.v];var u=document.getElementById('obUni');if(u)u.value=draft.uni;hideSuggest();updateCta();return;
    }
    if(act==='add-school'){addSchool();return;}
    if(act==='del-school'){draft.schools.splice(+b.dataset.i,1);render(true);return;}
    if(act==='make'){
      var vd=validate(draft);if(!vd.ok)return;
      var isL=draft.exam==='lgs',isY=draft.exam==='yks';
      state.profile={exam:draft.exam,alan:draft.alan,name:draft.name.trim(),
        uni:isL?'':draft.uni.trim(),dept:isL?'':draft.dept.trim(),schools:isL?draft.schools.slice():[],
        cur1:num(draft.cur1),tar1:num(draft.tar1),cur2:isY?num(draft.cur2):null,tar2:isY?num(draft.tar2):null,
        date:draft.date,hours:+draft.hours,start:draft.start||'09:00',createdAt:todayKey()};
      state.skipped=false;state.planDone={};state.planEdits={};state.denemeler=[];editing=false;welcome=true;progSel=null;tab='today';save();render();return;
    }
    if(act==='start'){welcome=false;tab='today';render();return;}
    if(act==='skip'){state.skipped=true;save();render();return;}
    if(act==='cancel-edit'){editing=false;render();return;}
    if(act==='open-ob'){startEdit();return;}

    if(act==='tab'){tab=id;pendingDelete=null;planEdit=false;render();return;}
    if(act==='prog'){progSel=b.dataset.v;render(true);return;}
    if(act==='toggle-plan'){
      var k0=todayKey(),arr=state.planDone[k0]||[],i0=+b.dataset.i;arr[i0]=!arr[i0];state.planDone[k0]=arr;save();render(true);return;
    }
    if(act==='add-deneme'){
      var progs=programsOf(state.profile),g=getSel(progs),net=num(val('dnNet')),dt=val('dnDate');
      if(isNaN(net)||net<0||net>g.max){toast('Net 0 ile '+g.max+' arasında olmalı');return;}
      if(!dt){toast('Tarih seç');return;}
      state.denemeler.push({id:uid(),prog:g.id,date:dt,net:net});save();render(true);toast('Deneme kaydedildi');return;
    }
    if(act==='del-deneme'){
      if(pendingDelete==='d'+id){state.denemeler=state.denemeler.filter(function(x){return x.id!==id;});pendingDelete=null;save();toast('Silindi');}
      else pendingDelete='d'+id;
      render(true);return;
    }
    if(act==='quick-habit'){addHabit(b.dataset.t);return;}
    if(act==='add-habit'){addHabit(val('newHabit'));return;}
    if(act==='toggle-habit'){
      var h=state.habits.filter(function(x){return x.id===id;})[0];if(!h)return;
      var k=todayKey();if(h.done[k])delete h.done[k];else h.done[k]=true;
      save();render(true);return;
    }
    if(act==='del-habit'){
      if(pendingDelete==='h'+id){state.habits=state.habits.filter(function(x){return x.id!==id;});pendingDelete=null;save();toast('Silindi');}
      else pendingDelete='h'+id;
      render(true);return;
    }
    if(act==='energy'){
      var k2=todayKey();state.logs[k2]=state.logs[k2]||{};state.logs[k2].energy=+b.dataset.n;
      var ans=document.getElementById('answer');if(ans)state.logs[k2].answer=ans.value;
      save();render(true);return;
    }
    if(act==='save-log'){
      var k3=todayKey();state.logs[k3]=state.logs[k3]||{};state.logs[k3].answer=val('answer');
      save();toast('Bugün kaydedildi');return;
    }
  });

  var OBMAP={obName:'name',obUni:'uni',obDept:'dept',obCity:'city',obSchool:'schoolName',obCur1:'cur1',obTar1:'tar1',obCur2:'cur2',obTar2:'tar2',obDate:'date',obStart:'start'};
  function onField(e){
    var el=e.target;
    if(el.id==='chatInput'){chatText=el.value;return;}
    if(el.id==='dmInput'){dmDraft=el.value;return;}
    if(el.id==='dmFind'){dmFind=el.value;paintDmFind();return;}
    if(el.id==='adSearch'){adQuery=el.value;paintAdmin();return;}
    if(el.id==='lgPw'||el.id==='lgPw2'){setLgErr('',false);return;}
    if(el.id==='lgHandle'){var nh=normHandle(el.value);if(el.value!==nh)el.value=nh;loginHandle=nh;setLgErr('',false);return;}
    if(el.id==='swLabel'){state.sw.label=el.value;saveSoon();return;}
    if(el.dataset&&el.dataset.pt!==undefined){if(planDraft[+el.dataset.pt])planDraft[+el.dataset.pt].t=el.value;return;}
    if(el.dataset&&el.dataset.pm!==undefined){if(planDraft[+el.dataset.pm])planDraft[+el.dataset.pm].min=+el.value;return;}
    if(el.id==='setHours'){var sl=document.getElementById('setHoursLabel');if(sl)sl.textContent=el.value+' saat';return;}
    if(OBMAP[el.id]){
      draft[OBMAP[el.id]]=el.value;
      if(el.id==='obStart'){var l=document.getElementById('obHoursLabel');if(l)l.textContent=hoursLabel(draft);}
      if(el.id==='obUni')showSuggest();
      updateCta();return;
    }
    if(el.id==='obHours'){draft.hours=+el.value;var lb=document.getElementById('obHoursLabel');if(lb)lb.textContent=hoursLabel(draft);return;}
    if(el.id==='answer'){
      var k=todayKey();state.logs[k]=state.logs[k]||{};state.logs[k].answer=el.value;saveSoon();
    }else if(el.dataset&&el.dataset.w!==undefined){
      var wk=weekKey();state.weekly[wk]=state.weekly[wk]||{a:[]};state.weekly[wk].a[+el.dataset.w]=el.value;saveSoon();
    }
  }
  document.addEventListener('input',onField);
  document.addEventListener('change',onField);
  document.addEventListener('focusin',function(e){if(e.target.id==='obUni')showSuggest();});
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;
    var id=e.target.id;
    if(id==='lgHandle'||id==='lgPw'||id==='lgPw2'){e.preventDefault();doLogin(false);}
    else if(id==='newHabit')addHabit(val('newHabit'));
    else if(id==='obSchool'){e.preventDefault();addSchool();}
    else if(id==='chatInput'){e.preventDefault();sendChat();}
    else if(id==='dmInput'){e.preventDefault();sendDm();}
    else if(id==='obUni')hideSuggest();
  });

  render();
  initDb();
  setInterval(tick,1000);
})();
</script>
</body>
</html>
